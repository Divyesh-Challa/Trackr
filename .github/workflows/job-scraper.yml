name: Mass Job Ingestion Pipeline

on:
  schedule:
    # Runs every 6 hours (free GitHub Actions runner schedule)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      max_records:
        description: 'Maximum roles to ingest'
        required: false
        default: '350'

jobs:
  scrape-and-ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ingestion Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx beautifulsoup4 numpy asyncpg

      - name: Run Trackr Multi-Source Ingestion Pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GATEWAY_URL: ${{ secrets.GATEWAY_URL || 'https://trackr-gateway.onrender.com' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAX_RECORDS: ${{ github.event.inputs.max_records || '350' }}
          PYTHONPATH: workers
        run: |
          python workers/run_mass_ingest.py
