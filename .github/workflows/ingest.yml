name: Ingest jobs

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours, off the top of the hour
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingest/requirements.txt

      - run: pip install -r ingest/requirements.txt

      - name: Unit tests
        run: python -m pytest ingest/tests -q

      - name: Ingest
        env:
          INGEST_DATABASE_URL: ${{ secrets.INGEST_DATABASE_URL }}
        run: python -m ingest
