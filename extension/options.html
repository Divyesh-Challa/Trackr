<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Trackr Autofill options</title>
    <link rel="stylesheet" href="/src/page.css" />
  </head>
  <body>
    <main>
      <h1>Trackr Autofill</h1>
      <p>Create a token on your Trackr profile page under “Extension &amp; API tokens”, then paste it here.</p>
      <form id="settings">
        <label for="baseUrl">Trackr address</label>
        <input id="baseUrl" type="url" required />
        <label for="token">API token</label>
        <input id="token" type="password" autocomplete="off" placeholder="trk_…" />
        <label for="resume">Résumé PDF to attach</label>
        <input id="resume" type="file" accept="application/pdf" />
        <p id="resumeName" class="hint"></p>
        <button type="submit">Save</button>
        <p id="status" role="status" aria-live="polite"></p>
      </form>
      <p class="hint">The extension fills forms and never submits them. When you press Submit, it saves what the form said to your Trackr receipts.</p>
    </main>
    <script type="module" src="/src/options.ts"></script>
  </body>
</html>
